name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Type check (mypy)
        # `mypy strict` is set in pyproject but currently overridden for
        # stripe_reconciler.* via `ignore_errors=true`. The override is being
        # phased out; keeping `continue-on-error` here while individual modules
        # are migrated. Hard-gate once the override is removed.
        run: mypy .
        continue-on-error: true
      - name: Test (pytest with coverage gate from pyproject)
        run: pytest -q --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

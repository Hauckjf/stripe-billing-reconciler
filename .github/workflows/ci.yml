name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Sem `cache: pip` (cache exige requirements.txt/poetry.lock; antes do scaffold completar, isso quebra).
      - run: python -m pip install -U pip
      - run: pip install -e ".[dev]" 2>/dev/null || pip install -r requirements.txt 2>/dev/null || pip install -e .
      - run: ruff check . || true
      - run: mypy . || true
      - run: pytest -q --cov=stripe_billing_reconciler --cov-report=xml || true
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false

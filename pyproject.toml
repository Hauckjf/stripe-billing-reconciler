[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stripe-billing-reconciler"
version = "0.1.0"
description = "Reconcile Stripe charges and subscriptions against your internal orders table"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["stripe", "billing", "reconciliation", "payments", "fintech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial",
    "Typing :: Typed",
]
dependencies = [
    "stripe>=7.0",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "tenacity>=8.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "mypy>=1.9",
    "ruff>=0.4",
    "hypothesis>=6.100",
    "tenacity>=8.2",
    "rich>=13.0",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "stripe>=7.0",
]

[project.scripts]
stripe-reconciler = "stripe_billing_reconciler.cli:main"

[project.urls]
Homepage = "https://github.com/Hauckjf/stripe-billing-reconciler"
Repository = "https://github.com/Hauckjf/stripe-billing-reconciler"
"Bug Tracker" = "https://github.com/Hauckjf/stripe-billing-reconciler/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["stripe_reconciler.*", "reconciler.*"]
ignore_errors = true

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D203",   # one-blank-line-before-class — conflicts with D211
    "D213",   # multi-line-docstring-summary-second-line — conflicts with D212
    "ANN101", # missing-type-annotation-self
    "COM812", # missing-trailing-comma — conflicts with ruff format
    "ISC001", # single-line-implicit-string-concatenation — conflicts with ruff format
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "D", "PLR2004", "SLF001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = ["src"]
branch = true

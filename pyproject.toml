[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stripe-billing-reconciler"
version = "0.1.0"
description = "Reconcile Stripe charges against your internal orders table — cursor-paginated, idempotent, rate-limit-aware"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "stripe>=8",
    "pydantic>=2",
    "pydantic-settings",
    "typer",
    "rich",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov",
    "mypy",
    "ruff",
    "vcrpy",
    "pytest-mock",
]

[project.scripts]
stripe-reconcile = "stripe_reconciler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/stripe_reconciler", "src/reconciler"]

[tool.mypy]
strict = true
python_version = "3.12"
mypy_path = "src"

[tool.ruff]
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Docstring rules — not enforced for this CLI tool
    "D100",
    "D101",
    "D102",
    "D103",
    "D104",
    "D105",
    "D106",
    "D107",
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
    # Formatter-incompatible rules
    "COM812", # trailing comma (managed by ruff format)
    "ISC001", # implicit string concatenation (managed by ruff format)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN", "S101"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = [
    "slow: mark test as slow-running",
]
